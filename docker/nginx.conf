upstream nuxt_upstream {
    server nuxt:3000;
    keepalive 32;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;
    root /var/www/nuxt;

    # === 共用安全 headers（CSP 不在此設定，由 nuxt-security 從 Nitro 注入）===
    # 注意：Nginx 的 add_header 在 location 內若再宣告會「整組重設」，
    # 所以共用 header 只放 server 區塊，location 內不重複加 CSP。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # === 靜態 chunk / asset：nginx 直接吐，1 年強快取（檔名含 hash，內容不可變）===
    location /_nuxt/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # === API 路由：永遠走 Nitro，禁快取 ===
    location /api/ {
        proxy_pass http://nuxt_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    # === SSR 路由（login / register / kyc）：代理到 Nitro，嚴禁快取 ===
    # nonce 每次請求都不同，若被 Nginx / 上游 CDN 快取會把 A 的 nonce 餵給 B，
    # 形成 CSP bypass 風險 — 必須明確 proxy_no_cache。
    # CSP header 由 nuxt-security 在 Nitro 端注入，這裡 NEVER 重設 Content-Security-Policy。
    location ~ ^/(trader/(login|register|kyc)|admin/login)(/.*)?$ {
        proxy_pass http://nuxt_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    # === 預設：先試靜態（SSG prerender），找不到就 fall back 到 Nitro（CSR shell） ===
    # / 與 /trader 已在 build 時預渲染為 index.html → nginx 直接吐
    # 其他 CSR 路由（/admin/**、/bank/**、/trader/markets 等）→ 進 @nitro 取 SPA shell
    location / {
        try_files $uri $uri.html $uri/index.html @nitro;
    }

    location @nitro {
        proxy_pass http://nuxt_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
